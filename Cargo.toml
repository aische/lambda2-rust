[package]
name = "lambda2"
version = "0.1.0"
edition = "2024"
description = "Command-line interpreter for the lambda2 language (https://dvde.biz/lambda2/)"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ryu-js = "1.0"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"

[profile.release]
debug = 1
